[package]
name = "rrename"
authors = ["Oleks Pickle <22867443+olekspickle@users.noreply.github.com>"]
version = "0.1.3"
edition = "2024"
license = "MIT OR Apache-2.0"
exclude = ["mock"]
repository = "https://github.com/olekspickle/rrename"
description = """"
Opinionated tool to rename files in batch.
Match regular expression, replace some characters I consider noise to kebab case
"""

[dependencies]
anyhow = "1.0.93"
clap = { version = "4.5.21", features = ["derive", "cargo"] }
clap-verbosity-flag = { version = "3.0.4", default-features = false, features = ["tracing"] }
jwalk = "0.8.1"
rand = "0.9.0"
regex = "1.11.1"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
strum = { version = "0.27.2", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"

[lib]
name = "rrename"
path = "src/lib.rs"

[[bin]]
name = "rrename"
path = "bin/rrename.rs"

[dev-dependencies]
expect-test = "1.5.0"
