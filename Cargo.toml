[package]
name = "rrename"
authors = ["Oleks Pickle <22867443+olekspickle@users.noreply.github.com>"]
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/olekspickle/rrename"
description = """"
Opinionated tool to rename files in batch.
Match regular expression, replace some characters I consider noise to kebab case
"""

[dependencies]
anyhow = "1.0.93"
clap = { version = "4.5.21", features = ["derive", "cargo"] }
jwalk = "0.8.1"
rand = "0.9.0"
regex = "1.11.1"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
strum = { version = "0.26.3", features = ["derive"] }

[lib]
name = "rrename"
path = "src/lib.rs"

[[bin]]
name = "rrename"
path = "bin/rrename.rs"

[dev-dependencies]
expect-test = "1.5.0"
